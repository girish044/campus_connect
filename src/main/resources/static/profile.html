<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect - My Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">🎓 CampusConnect</div>
    <div class="nav-links">
      <a href="marketplace.html">🏪 Marketplace</a>
      <a href="mylistings.html">📋 My Listings</a>
      <a href="profile.html" class="active">👤 Profile</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      <h2>👤 My Profile</h2>
      <p class="subtitle">Manage your account information.</p>

      <div id="profileMsg" class="msg" style="display:none;"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="profileName" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="profileEmail" disabled />
        <small style="color:#888;">Email cannot be changed.</small>
      </div>
      <div class="form-group">
        <label>College</label>
        <input type="text" id="profileCollege" placeholder="Your college name" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="profilePhone" placeholder="Your phone number" />
      </div>

      <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
    </div>
  </div>

  <footer class="footer">
    &copy; 2025 CampusConnect &mdash; Made with ❤️ for college students
  </footer>

  <script src="profile.js"></script>
</body>
</html>

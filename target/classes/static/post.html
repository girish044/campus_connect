<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect - Post Item</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">🎓 CampusConnect</div>
    <div class="nav-links">
      <a href="marketplace.html">🏪 Marketplace</a>
      <a href="mylistings.html">📋 My Listings</a>
      <a href="profile.html">👤 Profile</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      <h2>Post Your Item for Sale</h2>
      <p class="subtitle">Fill in the details below to list your item on the marketplace.</p>

      <div id="postMsg" class="msg" style="display:none;"></div>

      <div class="form-group">
        <label>Item Title *</label>
        <input type="text" id="title" placeholder="e.g. Engineering Mathematics Book" />
      </div>

      <div class="form-group">
        <label>Category *</label>
        <select id="category">
          <option value="">-- Select Category --</option>
          <option value="Books">📚 Books</option>
          <option value="Electronics">💻 Electronics</option>
          <option value="Furniture">🪑 Furniture</option>
          <option value="Clothing">👕 Clothing</option>
          <option value="Cycle">🚲 Cycle / Bike</option>
          <option value="Notes">📓 Notes</option>
          <option value="Hostel Items">🛏️ Hostel Items</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea id="description" rows="4" placeholder="Describe the item - condition, age, any damage, why selling..."></textarea>
      </div>

      <div class="form-group">
        <label>Price (₹) *</label>
        <input type="number" id="price" placeholder="Enter price in rupees" min="1" />
      </div>

      <div class="form-group">
        <label>Contact Phone</label>
        <input type="text" id="phone" placeholder="Phone number for buyers to contact you" />
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="postListing()">Post Item</button>
        <button class="btn btn-secondary" onclick="window.location.href='marketplace.html'">Cancel</button>
      </div>
    </div>
  </div>

  <script src="post.js"></script>
</body>
</html>

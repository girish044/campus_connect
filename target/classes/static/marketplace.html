<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect - Marketplace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">🎓 CampusConnect</div>
    <div class="nav-links">
      <a href="marketplace.html" class="active">🏪 Marketplace</a>
      <a href="mylistings.html">📋 My Listings</a>
      <a href="profile.html">👤 Profile</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </div>
  </nav>

  <div class="container">

    <!-- WELCOME BAR -->
    <div class="welcome-bar">
      <span id="welcomeText">Welcome!</span>
      <button class="btn btn-success btn-sm" onclick="window.location.href='post.html'">+ Post Item</button>
    </div>

    <!-- SEARCH AND FILTER -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search products, books, electronics..." />
      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Books">📚 Books</option>
        <option value="Electronics">💻 Electronics</option>
        <option value="Furniture">🪑 Furniture</option>
        <option value="Clothing">👕 Clothing</option>
        <option value="Cycle">🚲 Cycle / Bike</option>
        <option value="Notes">📓 Notes</option>
        <option value="Hostel Items">🛏️ Hostel Items</option>
        <option value="Other">📦 Other</option>
      </select>
      <button class="btn btn-primary" onclick="searchListings()">Search</button>
      <button class="btn btn-secondary" onclick="clearSearch()">Clear</button>
    </div>

    <!-- LISTINGS -->
    <div id="listingContainer" class="listing-grid">
      <p class="loading-text">Loading listings...</p>
    </div>

  </div>

  <!-- CONTACT MODAL -->
  <div id="contactModal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3>Contact Seller</h3>
      <div id="contactDetails"></div>
      <br>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </div>

  <footer class="footer">
    &copy; 2025 CampusConnect &mdash; Made with ❤️ for college students
  </footer>

  <script src="app.js"></script>
</body>
</html>

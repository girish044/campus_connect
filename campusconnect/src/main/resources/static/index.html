<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">

    <div class="auth-logo">
      <h1>🎓 CampusConnect</h1>
      <p>Your College Buy & Sell Marketplace</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginSection" class="auth-box">
      <h2>Login</h2>
      <div id="loginMsg" class="msg" style="display:none;"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" />
      </div>

      <button class="btn btn-primary" onclick="doLogin()">Login</button>

      <p class="switch-link">Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupSection" class="auth-box" style="display:none;">
      <h2>Create Account</h2>
      <div id="signupMsg" class="msg" style="display:none;"></div>

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="signupName" placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="signupEmail" placeholder="Enter your college email" />
      </div>
      <div class="form-group">
        <label>Password * <small>(min 6 characters)</small></label>
        <input type="password" id="signupPassword" placeholder="Create a password" />
      </div>
      <div class="form-group">
        <label>College Name</label>
        <input type="text" id="signupCollege" placeholder="e.g. IIT Delhi, BITS Pilani" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="signupPhone" placeholder="Enter your phone number" />
      </div>

      <button class="btn btn-primary" onclick="doSignup()">Create Account</button>

      <p class="switch-link">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>

  </div>

  <script src="auth.js"></script>
</body>
</html>
